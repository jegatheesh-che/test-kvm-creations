<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KVM Creations Studio — Welcome</title>
  <meta name="description" content="KVM Creations Studio — luxury wedding photography and cinematic films studio in Toronto, Canada. Fine art visual storytelling by Mathu & Vithu." />
  <link rel="canonical" href="https://www.kvmcreationsstudio.ca/" />
  <link rel="icon" href="assets/images/img1.webp" type="image/webp" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="preconnect" href="https://unpkg.com" crossorigin />
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="KVM Creations Studio — Luxury Wedding Photography & Films | Toronto" />
  <meta property="og:description" content="Fine art wedding photography and cinematic films by Mathu & Vithu in Toronto, Canada. Capturing love stories with timeless elegance." />
  <meta property="og:url" content="https://www.kvmcreationsstudio.ca/" />
  <meta property="og:image" content="https://www.kvmcreationsstudio.ca/assets/slide/kvm_creations_studio-116 (1).webp" />
  <meta property="og:site_name" content="KVM Creations Studio" />
  <meta property="og:locale" content="en_CA" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="KVM Creations Studio — Luxury Wedding Photography & Films" />
  <meta name="twitter:description" content="Fine art wedding photography and cinematic films in Toronto, Canada." />
  <meta name="twitter:image" content="https://www.kvmcreationsstudio.ca/assets/slide/kvm_creations_studio-116 (1).webp" />

  <style>
    @font-face { font-family: 'Top Luxury'; src: url('assets/fonts/TOPLUXURY.otf') format('opentype'); font-display: swap; }
    @font-face { font-family: 'Cardival Demo'; src: url('assets/fonts/Cardival Demo.ttf') format('truetype'); font-display: swap; }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --gold: #d4af37;
      --dark: #0a0a08;
      --cream: #faf8f4;
    }

    html, body {
      background: var(--dark);
      color: var(--cream);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      height: 100dvh;
      width: 100vw;
    }

    /* ===== PHOTO GRID MOSAIC ===== */
    .landing {
      position: relative;
      width: 100%;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .photo-mosaic {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      grid-template-rows: repeat(4, 1fr);
      gap: 6px;
      padding: 6px;
      z-index: 1;
    }

    /* Creative asymmetric cell spans */
    .mosaic-cell:nth-child(1)  { grid-column: 1 / 2; grid-row: 1 / 2; }
    .mosaic-cell:nth-child(2)  { grid-column: 2 / 4; grid-row: 1 / 2; }
    .mosaic-cell:nth-child(3)  { grid-column: 4 / 5; grid-row: 1 / 3; }
    .mosaic-cell:nth-child(4)  { grid-column: 5 / 6; grid-row: 1 / 2; }
    .mosaic-cell:nth-child(5)  { grid-column: 1 / 3; grid-row: 2 / 3; }
    .mosaic-cell:nth-child(6)  { grid-column: 3 / 4; grid-row: 2 / 3; }
    .mosaic-cell:nth-child(7)  { grid-column: 5 / 6; grid-row: 2 / 4; }
    .mosaic-cell:nth-child(8)  { grid-column: 1 / 2; grid-row: 3 / 4; }
    .mosaic-cell:nth-child(9)  { grid-column: 2 / 3; grid-row: 3 / 5; }
    .mosaic-cell:nth-child(10) { grid-column: 3 / 5; grid-row: 3 / 4; }
    .mosaic-cell:nth-child(11) { grid-column: 1 / 2; grid-row: 4 / 5; }
    .mosaic-cell:nth-child(12) { grid-column: 3 / 4; grid-row: 4 / 5; }
    .mosaic-cell:nth-child(13) { grid-column: 4 / 6; grid-row: 4 / 5; }

    .mosaic-cell {
      position: relative;
      overflow: hidden;
      border-radius: 4px;
    }

    .mosaic-cell img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(1.08);
      filter: brightness(0.85) saturate(1.1);
      opacity: 0;
      transition: opacity 1.0s cubic-bezier(0.25, 1, 0.5, 1),
                  transform 4.5s cubic-bezier(0.16, 1, 0.3, 1),
                  filter 0.5s ease;
      will-change: transform, opacity;
    }

    .mosaic-cell img.active {
      opacity: 1;
      transform: scale(1.00);
    }

    .mosaic-cell:hover img {
      filter: brightness(1) saturate(1.2);
    }

    /* The iris shutter overlay — starts fully covering each cell */
    .iris-shutter {
      position: absolute;
      inset: 0;
      background: var(--dark);
      z-index: 2;
      transform-origin: center;
      /* starts at scaleY(1) — GSAP will animate to scaleY(0) */
      border-radius: 4px;
    }

    /* ===== CENTER CONTENT — hidden until GSAP reveals ===== */
    .landing-center {
      position: relative;
      z-index: 10;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
      padding: 60px 48px;
      visibility: hidden; /* JS makes visible after iris */
    }

    /* ===== LIQUID GLASSMORPHISM CARD — minimal ===== */
    .glass-card {
      position: absolute;
      inset: -12px -24px;
      border-radius: 18px;
      z-index: -1;
      opacity: 0;

      background: rgba(255,255,255,0.07);
      backdrop-filter: blur(4px) saturate(1.4);
      -webkit-backdrop-filter: blur(4px) saturate(1.4);

      border: 1px solid rgba(255,255,255,0.14);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.18),
        0 4px 24px rgba(0,0,0,0.12);
    }

    /* Subtle top-left shimmer only */
    .glass-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 55%; height: 45%;
      background: linear-gradient(135deg, rgba(255,255,255,0.12) 0%, transparent 70%);
      border-radius: 18px 0 0 0;
      pointer-events: none;
    }

    .glass-card::after { display: none; }

    .brand-label {
      font-family: 'Cardival Demo', serif;
      font-size: clamp(0.6rem, 1.1vw, 0.85rem);
      letter-spacing: 9px;
      text-transform: uppercase;
      background: #ffffff;
      padding: 6px 12px 6px 21px; /* Balanced left/right padding considering 9px letter-spacing */
      border-radius: 50px;
      display: inline-block;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
      opacity: 0;
    }

    .brand-label-inner {
      background: linear-gradient(135deg, #8b6508 0%, #f1d47e 50%, #a67c1e 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: bold;
      display: inline-block;
    }

    .brand-name {
      font-family: 'Top Luxury', serif;
      font-size: clamp(3.5rem, 10vw, 8.5rem);
      background: linear-gradient(135deg, #8b6508 0%, #f1d47e 50%, #a67c1e 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 0.9;
      letter-spacing: 3px;
      filter: drop-shadow(0 4px 20px rgba(0,0,0,0.6));
      opacity: 0;
    }

    .brand-name em {
      font-style: italic;
      font-family: 'Top Luxury', serif;
      font-weight: bold;
      color: #ffffff;
      background: none;
      -webkit-text-fill-color: #ffffff;
      font-size: 0.52em;
      display: block;
      margin-top: 10px;
      letter-spacing: 7px;
    }

    .brand-line {
      width: 0px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      opacity: 0;
    }

    .enter-btn {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      padding: 16px 48px;
      font-family: 'Cardival Demo', serif;
      font-size: 0.75rem;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: #0a0a08;
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid #ffffff;
      border-radius: 50px;
      cursor: pointer;
      text-decoration: none;
      position: relative;
      overflow: hidden;
      opacity: 0;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
      transition: border-color 0.5s, color 0.5s, transform 0.4s cubic-bezier(0.22,1,0.36,1), box-shadow 0.5s;
    }

    .enter-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, #d4af37 0%, #f1d47e 50%, #a67c1e 100%);
      transform: scaleX(0);
      transform-origin: right;
      transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
      z-index: -1;
      border-radius: 50px;
    }

    .enter-btn:hover {
      border-color: transparent;
      color: #ffffff;
      transform: scale(1.05);
      box-shadow: 0 12px 32px rgba(212,175,55,0.4);
    }

    .enter-btn:hover::before { 
      transform: scaleX(1); 
      transform-origin: left;
    }

    .enter-btn .arrow {
      display: inline-block;
      transition: transform 0.4s cubic-bezier(0.22,1,0.36,1);
    }
    .enter-btn:hover .arrow { transform: translateX(8px); }

    /* ===== MOBILE ===== */
    @media (max-width: 768px) {
      .photo-mosaic {
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(5, 1fr);
        gap: 4px;
        padding: 4px;
      }
      .mosaic-cell:nth-child(1)  { grid-column: 1 / 2; grid-row: 1 / 2; }
      .mosaic-cell:nth-child(2)  { grid-column: 2 / 3; grid-row: 1 / 2; }
      .mosaic-cell:nth-child(3)  { grid-column: 3 / 4; grid-row: 1 / 3; }
      .mosaic-cell:nth-child(4)  { grid-column: 1 / 3; grid-row: 2 / 3; }
      .mosaic-cell:nth-child(5)  { grid-column: 1 / 2; grid-row: 3 / 4; }
      .mosaic-cell:nth-child(6)  { grid-column: 2 / 4; grid-row: 3 / 4; }
      .mosaic-cell:nth-child(7)  { grid-column: 1 / 3; grid-row: 4 / 5; }
      .mosaic-cell:nth-child(8)  { grid-column: 3 / 4; grid-row: 4 / 5; }
      .mosaic-cell:nth-child(9)  { grid-column: 1 / 2; grid-row: 5 / 6; }
      .mosaic-cell:nth-child(10) { grid-column: 2 / 4; grid-row: 5 / 6; }
      .mosaic-cell:nth-child(11),
      .mosaic-cell:nth-child(12),
      .mosaic-cell:nth-child(13) { display: none; }

      .landing-center { padding: 36px 20px; gap: 16px; }
      .enter-btn { padding: 14px 32px; font-size: 0.6rem; letter-spacing: 4px; }
    }

    @media (max-width: 480px) {
      .photo-mosaic {
        grid-template-columns: repeat(2, 1fr);
        grid-template-rows: repeat(5, 1fr);
      }
      .mosaic-cell:nth-child(1)  { grid-column: 1 / 2; grid-row: 1 / 2; }
      .mosaic-cell:nth-child(2)  { grid-column: 2 / 3; grid-row: 1 / 2; }
      .mosaic-cell:nth-child(3)  { grid-column: 1 / 3; grid-row: 2 / 3; }
      .mosaic-cell:nth-child(4)  { grid-column: 1 / 2; grid-row: 3 / 4; }
      .mosaic-cell:nth-child(5)  { grid-column: 2 / 3; grid-row: 3 / 5; }
      .mosaic-cell:nth-child(6)  { grid-column: 1 / 2; grid-row: 4 / 5; }
      .mosaic-cell:nth-child(7)  { grid-column: 1 / 3; grid-row: 5 / 6; }
      .mosaic-cell:nth-child(8),
      .mosaic-cell:nth-child(9),
      .mosaic-cell:nth-child(10),
      .mosaic-cell:nth-child(11),
      .mosaic-cell:nth-child(12),
      .mosaic-cell:nth-child(13) { display: none; }
    }
  </style>
</head>
<body>

  <div class="landing">

    <!-- PHOTO MOSAIC BACKGROUND -->
    <div class="photo-mosaic" id="photoMosaic">
      <div class="mosaic-cell" data-interval="4200" data-delay="2200"><div class="iris-shutter"></div><img src="assets/images/img3.webp"  alt="KVM Creations Studio wedding photography Toronto" class="active" loading="eager" /></div>
      <div class="mosaic-cell" data-interval="5600" data-delay="4100"><div class="iris-shutter"></div><img src="assets/images/img7.webp"  alt="Fine art bridal portrait by KVM Creations Studio" class="active" loading="eager" /></div>
      <div class="mosaic-cell" data-interval="4800" data-delay="1800"><div class="iris-shutter"></div><img src="assets/images/img12.webp" alt="Destination wedding photography Canada" class="active" loading="eager" /></div>
      <div class="mosaic-cell" data-interval="6200" data-delay="5300"><div class="iris-shutter"></div><img src="assets/images/img18.webp" alt="Cinematic wedding moments captured" class="active" loading="eager" /></div>
      <div class="mosaic-cell" data-interval="4500" data-delay="3300"><div class="iris-shutter"></div><img src="assets/images/img22.webp" alt="Engagement shoot photography Toronto" class="active" loading="eager" /></div>
      <div class="mosaic-cell" data-interval="5800" data-delay="4700"><div class="iris-shutter"></div><img src="assets/images/img5.webp"  alt="Luxury wedding ceremony photography" class="active" loading="eager" /></div>
      <div class="mosaic-cell" data-interval="3900" data-delay="2500"><div class="iris-shutter"></div><img src="assets/images/img28.webp" alt="Fine art portrait session Ontario" class="active" loading="eager" /></div>
      <div class="mosaic-cell" data-interval="5200" data-delay="5900"><div class="iris-shutter"></div><img src="assets/images/img15.webp" alt="Editorial photography by KVM Creations Studio" class="active" loading="eager" /></div>
      <div class="mosaic-cell" data-interval="4600" data-delay="3700"><div class="iris-shutter"></div><img src="assets/images/img9.webp"  alt="Candid wedding photography moments" class="active" loading="eager" /></div>
      <div class="mosaic-cell" data-interval="6400" data-delay="2900"><div class="iris-shutter"></div><img src="assets/images/img31.webp" alt="Couple portrait photography Toronto" class="active" loading="eager" /></div>
      <div class="mosaic-cell" data-interval="4100" data-delay="5100"><div class="iris-shutter"></div><img src="assets/images/img1.webp"  alt="KVM Creations Studio showcase" class="active" loading="eager" /></div>
      <div class="mosaic-cell" data-interval="5500" data-delay="3500"><div class="iris-shutter"></div><img src="assets/images/img20.webp" alt="Wedding day details photography" class="active" loading="eager" /></div>
      <div class="mosaic-cell" data-interval="4900" data-delay="4400"><div class="iris-shutter"></div><img src="assets/images/img25.webp" alt="Golden hour wedding photography" class="active" loading="eager" /></div>
    </div>

    <!-- CENTER BRAND + ENTER -->
    <div class="landing-center" id="landingCenter">
      <div class="glass-card" id="glassCard"></div>
      <span class="brand-label" id="brandLabel"><span class="brand-label-inner">Photography &amp; Cinematography</span></span>
      <h1 class="brand-name" id="brandName">
        KVM
        <em>Creations Studio</em>
      </h1>
      <div class="brand-line" id="brandLine"></div>
      <a href="home.html" class="enter-btn" id="enterBtn">
        Enter Site <span class="arrow">&#8594;</span>
      </a>
    </div>

  </div>

  <!-- GSAP -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/gsap.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {

      const cells   = document.querySelectorAll('.mosaic-cell');
      const shutters = document.querySelectorAll('.iris-shutter');
      const center  = document.getElementById('landingCenter');
      const label   = document.getElementById('brandLabel');
      const name    = document.getElementById('brandName');
      const line    = document.getElementById('brandLine');
      const btn     = document.getElementById('enterBtn');

      // ─── Step 1: Calculate each cell's distance from the screen center ───
      const cx = window.innerWidth  / 2;
      const cy = window.innerHeight / 2;

      const cellData = Array.from(cells).map(cell => {
        const r   = cell.getBoundingClientRect();
        const ccx = r.left + r.width  / 2;
        const ccy = r.top  + r.height / 2;
        const dist = Math.sqrt((ccx - cx) ** 2 + (ccy - cy) ** 2);
        return { cell, shutter: cell.querySelector('.iris-shutter'), dist };
      });

      // Sort by distance: closest (center) first
      cellData.sort((a, b) => a.dist - b.dist);

      const maxDist    = cellData[cellData.length - 1].dist;
      const irisStart  = 0.2;   // when iris animation starts (seconds)
      const irisDur    = 2.6;   // total iris spread duration
      const cellReveal = 1.0;   // each individual shutter animation duration

      // ─── Step 2: GSAP Iris Reveal — center ripple outward ───
      const tl = gsap.timeline();

      cellData.forEach(({ shutter, dist }) => {
        // Map distance to a delay: 0px → starts first, maxDist → starts last
        const delay = irisStart + (dist / maxDist) * irisDur;

        tl.to(shutter, {
          scaleY: 0,
          transformOrigin: 'top center',
          duration: cellReveal,
          ease: 'power3.inOut',
        }, delay);
      });

      // ─── Step 3: Glass card + brand text float in after last ripple ───
      const textStart = irisStart + irisDur + 0.1;
      const glass = document.getElementById('glassCard');

      // Make center visible before animating
      tl.set(center, { visibility: 'visible' }, textStart - 0.01);

      // Glass card materializes first — scale from slightly small, blurring into existence
      tl.fromTo(glass,
        { opacity: 0, scale: 0.88, filter: 'blur(20px)' },
        { opacity: 1, scale: 1, filter: 'blur(0px)', duration: 2.0, ease: 'power3.out' },
        textStart
      );

      tl.fromTo(name, 
        { opacity: 0, y: 40, filter: 'blur(8px)' },
        { opacity: 1, y: 0, filter: 'blur(0px)', duration: 1.8, ease: 'power3.out' },
        textStart
      );

      tl.fromTo(label,
        { opacity: 0, y: 14, letterSpacing: '4px' },
        { opacity: 1, y: 0, letterSpacing: '9px', duration: 1.4, ease: 'power3.out' },
        textStart + 0.25
      );

      tl.fromTo(line,
        { opacity: 0, width: '0px' },
        { opacity: 0.7, width: '70px', duration: 1.2, ease: 'power2.out' },
        textStart + 0.5
      );

      tl.fromTo(btn,
        { opacity: 0, y: 18 },
        { opacity: 1, y: 0, duration: 1.2, ease: 'power3.out' },
        textStart + 0.7
      );

      // ─── Step 4: Pro High-Performance Continuous Slideshow for Mosaic Cells ───
      const PHOTO_POOL = [
        'img1.webp', 'img2.webp', 'img3.webp', 'img4.webp', 'img5.webp',
        'img6.webp', 'img7.webp', 'img8.webp', 'img9.webp', 'img10.webp',
        'img11.webp', 'img12.webp', 'img13.webp', 'img14.webp', 'img15.webp',
        'img16.webp', 'img17.webp', 'img18.webp', 'img19.webp', 'img20.webp',
        'img21.webp', 'img22.webp', 'img23.webp', 'img24.webp', 'img25.webp',
        'img28.webp', 'img30.webp', 'img31.webp'
      ];

      // Preload image pool in background for instant, zero-delay swaps
      PHOTO_POOL.forEach(name => {
        const p = new Image();
        p.src = `assets/images/${name}`;
      });

      cells.forEach((cell, idx) => {
        const interval = 2800; // Smooth, energetic cadence (~2.8s per slide change)
        let poolIndex = (idx * 3 + 5) % PHOTO_POOL.length;

        function swapImage() {
          poolIndex = (poolIndex + 1) % PHOTO_POOL.length;
          const imgName = PHOTO_POOL[poolIndex];

          const newImg = document.createElement('img');
          newImg.alt = "KVM Creations Studio";
          newImg.loading = "eager";
          newImg.decoding = "async";

          function onReady() {
            const shutter = cell.querySelector('.iris-shutter');
            if (shutter) {
              cell.insertBefore(newImg, shutter);
            } else {
              cell.appendChild(newImg);
            }

            // Trigger CSS transition via requestAnimationFrame
            requestAnimationFrame(() => {
              newImg.classList.add('active');
            });

            // Clean up previous images after crossfade completes
            setTimeout(() => {
              const oldImgs = cell.querySelectorAll('img');
              oldImgs.forEach(img => {
                if (img !== newImg) img.remove();
              });
            }, 1100);
          }

          newImg.onload = onReady;
          newImg.onerror = () => {
            // Safety fallback: if load fails, try next image without stalling
            swapImage();
          };

          newImg.src = `assets/images/${imgName}`;
        }

        // Stagger initial starts across cells for an organic, cinematic visual wave
        setTimeout(() => {
          setInterval(swapImage, interval);
        }, 1200 + (idx * 220));
      });

    });
  </script>

</body>
