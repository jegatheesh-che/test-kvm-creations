<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Portal — KVM Creations Studio</title>
  <link rel="stylesheet" href="/admin/css/admin.css" />
</head>
<body>
  <div class="admin-login-wrapper">
    <div class="admin-card">
      <div class="admin-card__header">
        <h1 class="admin-card__title" style="letter-spacing: 1px; color: var(--clr-accent, #c9a96e);">KVM CREATIONS</h1>
        <p class="admin-card__subtitle">Management Authentication Portal</p>
      </div>

      <form id="loginForm" class="admin-form" novalidate>
        <div id="errorMessage" class="auth-error-msg" role="alert"></div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="admin@kvmcreations.com" required autocomplete="username" />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="••••••••••••" required autocomplete="current-password" />
        </div>

        <button type="submit" id="submitBtn" class="btn-primary">
          <span id="btnText">Sign In</span>
          <span id="btnSpinner" class="spinner" style="display: none;"></span>
        </button>
      </form>
    </div>
  </div>

  <script type="module" src="/admin/js/admin-login.js"></script>
</body>
</html>
