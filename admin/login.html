<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Portal — KVM Creation Studios</title>
  <style>
    :root {
      --clr-gold: #d4af37;
      --clr-gold-light: #f1d47e;
      --clr-dark: #0a0a08;
      --clr-card-bg: #141411;
      --clr-border: rgba(212, 175, 55, 0.25);
      --clr-text: #faf8f4;
      --clr-muted: #a09d96;
      --clr-error: #ff5252;
      --clr-success: #4caf50;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--clr-dark);
      color: var(--clr-text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .login-card {
      background: var(--clr-card-bg);
      border: 1px solid var(--clr-border);
      border-radius: 12px;
      padding: 40px 36px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
    }

    .brand-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .brand-header h1 {
      font-size: 1.6rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--clr-gold);
      margin-bottom: 6px;
    }

    .brand-header p {
      font-size: 0.82rem;
      color: var(--clr-muted);
      letter-spacing: 1px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--clr-muted);
      margin-bottom: 8px;
    }

    .form-input {
      width: 100%;
      padding: 14px 16px;
      background: #000000;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 6px;
      color: #ffffff;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.3s;
    }

    .form-input:focus {
      border-color: var(--clr-gold);
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      background: var(--clr-gold);
      color: #000000;
      border: none;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.3s, opacity 0.3s;
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .submit-btn:hover {
      background: var(--clr-gold-light);
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .error-box {
      display: none;
      background: rgba(255, 82, 82, 0.1);
      border: 1px solid var(--clr-error);
      color: var(--clr-error);
      padding: 12px 14px;
      border-radius: 6px;
      font-size: 0.82rem;
      margin-bottom: 20px;
      line-height: 1.4;
    }

    .error-box.show {
      display: block;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(0,0,0,0.2);
      border-top-color: #000;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    .loading .spinner {
      display: inline-block;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="brand-header">
      <h1>KVM Studio</h1>
      <p>Administrative Access Portal</p>
    </div>

    <div class="error-box" id="errorBox"></div>

    <form id="adminLoginForm" autocomplete="off">
      <div class="form-group">
        <label for="adminEmail">Email Address</label>
        <input type="email" id="adminEmail" class="form-input" placeholder="admin@kvmcreations.ca" required />
      </div>

      <div class="form-group">
        <label for="adminPassword">Password</label>
        <input type="password" id="adminPassword" class="form-input" placeholder="••••••••••••" required />
      </div>

      <button type="submit" class="submit-btn" id="loginBtn">
        <span class="spinner" id="btnSpinner"></span>
        <span id="btnText">Sign In to Studio Admin</span>
      </button>
    </form>
  </div>

  <script type="module" src="js/admin-auth.js"></script>
</body>
</html>
